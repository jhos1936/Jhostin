<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Monitor / pantalla principal -->
  <rect x="20" y="30" width="160" height="100" rx="12" ry="12" fill="url(#g1)" opacity="0.95"/>
  <rect x="30" y="40" width="140" height="80" rx="7" ry="7" fill="white" opacity="0.15"/>

  <!-- Líneas de datos en pantalla -->
  <rect x="40" y="52" width="60" height="7" rx="3" fill="white" opacity="0.9"/>
  <rect x="40" y="65" width="90" height="5" rx="2" fill="white" opacity="0.55"/>
  <rect x="40" y="76" width="75" height="5" rx="2" fill="white" opacity="0.55"/>
  <rect x="40" y="87" width="50" height="5" rx="2" fill="white" opacity="0.55"/>

  <!-- Mini gráfico de barras -->
  <rect x="125" y="88" width="10" height="24" rx="3" fill="white" opacity="0.85"/>
  <rect x="140" y="76" width="10" height="36" rx="3" fill="white" opacity="0.85"/>
  <rect x="155" y="65" width="10" height="47" rx="3" fill="white" opacity="0.85"/>

  <!-- Pie del monitor -->
  <rect x="88" y="130" width="24" height="16" rx="2" fill="url(#g2)" opacity="0.85"/>
  <rect x="70" y="146" width="60" height="8" rx="4" fill="url(#g2)" opacity="0.7"/>

  <!-- Engranaje (gestión) abajo derecha -->
  <circle cx="155" cy="160" r="22" fill="url(#g2)" opacity="0.95"/>
  <circle cx="155" cy="160" r="10" fill="white" opacity="0.9"/>
  <circle cx="155" cy="160" r="5" fill="url(#g2)"/>
  <!-- Dientes del engranaje -->
  <rect x="152" y="135" width="6" height="8" rx="2" fill="url(#g2)" opacity="0.9"/>
  <rect x="152" y="177" width="6" height="8" rx="2" fill="url(#g2)" opacity="0.9"/>
  <rect x="130" y="157" width="8" height="6" rx="2" fill="url(#g2)" opacity="0.9"/>
  <rect x="172" y="157" width="8" height="6" rx="2" fill="url(#g2)" opacity="0.9"/>
  <rect x="137" y="141" width="6" height="8" rx="2" fill="url(#g2)" opacity="0.9" transform="rotate(45 140 145)"/>
  <rect x="166" y="170" width="6" height="8" rx="2" fill="url(#g2)" opacity="0.9" transform="rotate(45 169 174)"/>
  <rect x="137" y="169" width="6" height="8" rx="2" fill="url(#g2)" opacity="0.9" transform="rotate(-45 140 173)"/>
  <rect x="166" y="141" width="6" height="8" rx="2" fill="url(#g2)" opacity="0.9" transform="rotate(-45 169 145)"/>

  <!-- Persona / usuario arriba izquierda -->
  <circle cx="42" cy="158" r="12" fill="url(#g1)" opacity="0.95"/>
  <circle cx="42" cy="153" r="5" fill="white" opacity="0.9"/>
  <ellipse cx="42" cy="166" rx="8" ry="5" fill="white" opacity="0.7"/>

  <!-- Checkmark / tarea -->
  <circle cx="98" cy="165" r="12" fill="url(#g1)" opacity="0.9"/>
  <polyline points="91,165 96,171 106,158" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
